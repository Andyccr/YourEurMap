<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161a20">
  <title>Europa Canvas</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div id="stage">
      <svg id="map" role="img" data-i18n-aria="mapLabel" aria-label="Greater Europe painting map"></svg>
      <div id="labels" aria-hidden="true"></div>
    </div>

    <header id="topbar" data-obstacle>
      <div class="brand">
        <p class="eyebrow" data-i18n="eyebrow">Atlas sandbox</p>
        <h1>Europa Canvas</h1>
      </div>
      <p id="scenario-label" class="scenario-label" data-i18n="chooseMap">Choose a map</p>
      <div class="desktop-tools" role="toolbar" data-i18n-aria="toolsLabel" aria-label="Map tools">
        <button type="button" id="tool-move" data-tool="move" aria-pressed="true"><span data-i18n="move">Move</span> <kbd>V</kbd></button>
        <button type="button" id="tool-paint" data-tool="paint" aria-pressed="false"><span data-i18n="paint">Paint</span> <kbd>B</kbd></button>
        <button type="button" id="tool-pick" data-tool="pick" aria-pressed="false"><span data-i18n="pick">Pick</span> <kbd>I</kbd></button>
        <button type="button" id="undo" data-i18n="undo" data-i18n-aria="undo" aria-label="Undo">Undo</button>
        <button type="button" id="redo" data-i18n="redo" data-i18n-aria="redo" aria-label="Redo">Redo</button>
      </div>
      <div class="top-actions">
        <button type="button" id="open-search" data-i18n="search" data-i18n-aria="search" aria-label="Search">Search</button>
        <button type="button" id="open-layers" data-i18n="layers" data-i18n-aria="layers" aria-label="Map layers">Layers</button>
        <button type="button" id="open-save" data-i18n="save">Save</button>
        <button type="button" id="open-menu" data-i18n="menu" data-i18n-aria="menu" aria-label="Menu">Menu</button>
      </div>
    </header>

    <div id="dock-backdrop" hidden></div>
    <aside id="dock" data-obstacle data-i18n-aria="dockLabel" aria-label="Countries and search" hidden>
      <div class="dock-head">
        <div class="search-row">
          <label class="sr-only" for="search" data-i18n="searchLabel">Search countries, provinces, and cities</label>
          <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Search countries, provinces, cities" autocomplete="off">
          <button type="button" id="clear-search" data-i18n="clear" data-i18n-aria="clear" aria-label="Clear search">Clear</button>
          <button type="button" id="close-dock" data-i18n="close" data-i18n-aria="close" aria-label="Close country list">Close</button>
        </div>
        <div class="tabs" role="tablist" data-i18n-aria="listLabel" aria-label="List">
          <button type="button" id="tab-countries" role="tab" aria-selected="true" data-i18n="countries">Countries</button>
          <button type="button" id="tab-provinces" role="tab" aria-selected="false" data-i18n="provinces">Provinces</button>
        </div>
        <button type="button" id="create-country" class="create-btn" data-i18n="createCountry">Create a country</button>
      </div>
      <div id="list" class="list" tabindex="0"></div>
    </aside>

    <section id="detail" data-obstacle hidden aria-live="polite"></section>
    <div id="brush" data-obstacle hidden></div>
    <div id="zoom" data-obstacle>
      <button type="button" id="zoom-in" data-i18n-aria="zoomIn" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" data-i18n-aria="zoomOut" aria-label="Zoom out">−</button>
      <button type="button" id="zoom-fit" data-i18n="fit" data-i18n-aria="fitLabel" aria-label="Show the whole map">Fit</button>
    </div>

    <nav id="mobilebar" data-i18n-aria="mobileTools" aria-label="Mobile tools">
      <button type="button" data-tool="move" data-i18n="move">Move</button>
      <button type="button" data-tool="paint" data-i18n="paint">Paint</button>
      <button type="button" data-tool="pick" data-i18n="pick">Pick</button>
      <button type="button" id="mobile-countries" data-i18n="countries">Countries</button>
      <button type="button" id="mobile-save" data-i18n="save">Save</button>
    </nav>

    <div id="toasts" aria-live="polite"></div>
    <div id="conflict" class="banner" hidden></div>
    <p id="status" class="status" role="status"></p>

    <section id="gate" class="gate">
      <div class="gate-card">
        <p class="eyebrow" data-i18n="greaterEurope">Greater Europe</p>
        <h2>Europa Canvas</h2>
        <p class="lede" data-i18n="gateLede">Choose an era, pick a country, and repaint the continent. No armies, no ledger — just the atlas.</p>
        <div id="gate-body"></div>
      </div>
    </section>
    <div id="modal-root"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
